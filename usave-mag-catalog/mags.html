<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel &amp; Tyre Catalogue — U-Save Tyre Co</title>
<style>
  :root{--charcoal:#0F0E0D;--concrete:#F4F2ED;--orange:#F2622A;--white:#fff;--line:#D8D4CA;--muted:#5b5850;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:repeating-linear-gradient(135deg,rgba(15,14,13,.028) 0px,rgba(15,14,13,.028) 1px,transparent 1px,transparent 14px),var(--concrete);
    color:var(--charcoal);font-family:'Barlow',Arial,sans-serif;line-height:1.5;min-height:100vh;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
  header{position:relative;overflow:hidden;background:var(--charcoal);color:#fff;padding:40px 20px 32px;text-align:center;}
  header::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--orange),#ffab7a,var(--orange));}
  header .logo{max-width:400px;width:86%;height:auto;margin-bottom:8px;}
  header .tagline{font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#c9c5ba;}
  .intro{padding:26px 0 8px;text-align:center;}
  .intro h1{font-size:26px;text-transform:uppercase;letter-spacing:.3px;}
  .intro p{color:var(--muted);font-size:14.5px;max-width:560px;margin:6px auto 0;}
  .tabs{display:flex;justify-content:center;gap:8px;margin:18px 0 14px;}
  .tab{border:2px solid var(--charcoal);background:transparent;padding:10px 22px;border-radius:4px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;font-size:14px;}
  .tab.active{background:var(--charcoal);color:#fff;}
  .tab span{opacity:.6;font-weight:600;margin-left:4px;}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:12px;}
  .filters input,.filters select{border:2px solid var(--line);background:#fff;border-radius:4px;padding:10px 12px;font-size:14px;font-family:inherit;}
  .filters input{flex:1;min-width:220px;max-width:380px;}
  .brands{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin;}
  .chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--charcoal);border-color:var(--charcoal);color:#fff;}
  .count{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08);}
  .photo{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;padding:14px;position:relative;}
  .photo img{width:100%;height:100%;object-fit:contain;}
  .photo .noimg{color:#aaa;font-size:12px;text-transform:uppercase;letter-spacing:1px;}
  .badge{position:absolute;top:10px;left:10px;background:var(--orange);color:#fff;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:4px 8px;border-radius:3px;}
  .info{padding:14px 14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;flex:1;}
  .brand{font-size:11.5px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:.6px;}
  .model{font-size:17px;font-weight:900;text-transform:uppercase;line-height:1.2;}
  .finish{font-size:13px;color:var(--muted);}
  .sizes{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;}
  .sizes span{font-size:11px;background:var(--concrete);border:1px solid var(--line);border-radius:3px;padding:2px 6px;font-weight:600;}
  .pcd{font-size:12px;color:var(--muted);}
  .price{font-size:13px;font-weight:800;margin-top:auto;padding-top:6px;}
  .actions{display:flex;gap:6px;margin-top:6px;}
  .btn{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:9px 8px;border-radius:4px;}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-secondary{border:2px solid var(--charcoal);color:var(--charcoal);padding:7px 8px;}
  .more{display:block;margin:26px auto 0;border:2px solid var(--charcoal);background:transparent;padding:12px 30px;border-radius:4px;font-weight:800;text-transform:uppercase;cursor:pointer;font-size:14px;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;}
  footer{margin-top:50px;background:var(--charcoal);color:#c9c5ba;text-align:center;padding:28px 20px;font-size:13px;position:relative;}
  footer::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--orange);}
  footer .credit{margin-top:10px;font-size:12px;color:#fff;}
  footer a{color:#fff;}
</style>
</head>

<header><a href="/"><img class="logo" src="/usave_logo.webp" alt="U-Save Tyre Co"></a><div class="tagline">Wheel &amp; Tyre Catalogue</div></header>

  <div class="brands" id="brands"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" style="display:none;">Show more</button>
</div>

    $('pcdFilter').style.display = tab === 'wheels' ? '' : 'none';
    const brands = [...new Set(list.map(x => x.b))].sort();
    $('brands').innerHTML = ['', ...brands].map(b => `<button class="chip${b===brand?' active':''}" data-b="${b}">${b || 'All brands'}</button>`).join('');
  }

  function filtered(){
    const q = $('search').value.trim().toLowerCase();
    const dia = $('diaFilter').value, pcd = $('pcdFilter').value;
    return DATA[tab].filter(x =>
      (!brand || x.b === brand) &&
      (!q || (x.b+' '+x.m+' '+(x.c||'')).toLowerCase().includes(q)) &&
      (!dia || x.s.some(s => diaOf(s) === dia)) &&
      (tab !== 'wheels' || !pcd || (x.p||[]).includes(pcd))
    ).sort((a,b) => (b.v?1:0)-(a.v?1:0) || (b.i?1:0)-(a.i?1:0));
  }

  function card(x){
    const photo = x.i ? `<img src="${x.i}" alt="${x.b} ${x.m}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'Photo coming soon'}))">` : `<div class="noimg">Photo coming soon</div>`;
    const sizes = x.s.slice(0,8).map(s=>`<span>${s}</span>`).join('') + (x.s.length>8?`<span>+${x.s.length-8}</span>`:'');
    const tryBtn = x.v ? `<a class="btn btn-primary" href="${VISUALISER_URL}?wheel=${x.v}">Try on your car</a>` : '';
    return `<div class="card">
      <div class="photo">${x.v?'<div class="badge">Try it on</div>':''}${photo}</div>
      <div class="info">
        <div class="brand">${x.b}</div>
        <div class="model">${x.m}</div>
        ${x.c?`<div class="finish">${x.c}</div>`:''}
        <div class="sizes">${sizes}</div>
        ${x.p && x.p.length ? `<div class="pcd">Stud pattern: ${x.p.join(', ')}</div>` : ''}
        <div class="price">Call for price</div>
        <div class="actions">${tryBtn}<a class="btn btn-secondary" href="tel:${PHONE}">Call us</a></div>
      </div></div>`;
  }

  function render(){
    const list = filtered();
    $('count').textContent = list.length + (tab==='wheels' ? ' wheel styles' : ' tyre ranges');
    $('grid').innerHTML = list.length ? list.slice(0, shown).map(card).join('') : '<div class="empty">Nothing matches that search — try clearing a filter.</div>';
    $('more').style.display = list.length > shown ? 'block' : 'none';
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    tab = t.dataset.tab; brand = ''; shown = PAGE_SIZE; $('search').value = '';
    fillFilters(); render();
  }));
  $('brands').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    brand = c.dataset.b; shown = PAGE_SIZE;
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === c));
    render();
  });
  ['search','diaFilter','pcdFilter'].forEach(id => $(id).addEventListener('input', () => { shown = PAGE_SIZE; render(); }));
  $('more').addEventListener('click', () => { shown += PAGE_SIZE; render(); });

  fillFilters(); render();
</script>
</body>
</html>
